name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Demo de analise offline
        run: python -m atalaia analyze auth:samples/auth.log http:samples/access.log firewall:samples/ufw.log
      - name: Sem travessao e sem emoji
        run: python scripts/checar_estilo.py
